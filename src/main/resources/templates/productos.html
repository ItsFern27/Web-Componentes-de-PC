<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCCore - Catálogo</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tus estilos -->
  <link rel="stylesheet" th:href="@{/styles/styles.css}" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>
<body>
  
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="container mt-4">

    <!-- Título -->
    <div class="text-center mb-4">
      <h1 class="text-center mb-4">Nuestro Catálogo de Productos</h1>
    </div>
    
    <!-- Filtros y Búsqueda -->
    <div class="row mb-4">
      <div class="col-md-6 mb-3">
        <input type="text" id="productSearch" class="form-control" placeholder="Buscar productos...">
      </div>
      <div class="col-md-6 mb-3">
        <select id="productCategory" class="form-select">
          <option value="all">Todas las categorías</option>
          <option value="pcs">PCs y Laptops</option>
          <option value="componentes">Componentes</option>
          <option value="perifericos">Periféricos</option>
          <option value="almacenamiento">Almacenamiento</option>
          <option value="redes">Redes</option>
        </select>
      </div>
    </div>

    <!-- Lista de productos -->
    <div class="row g-4">
      <div class="col-12">
        <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info">No hay productos para mostrar.</div>
      </div>

      <div class="col-md-3 col-sm-6" th:each="producto : ${productos}">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-body text-center">
            <!-- Lógica de imagen consistente -->
            <img class="card-img-top" th:if="${producto.imagen != null and #strings.startsWith(producto.imagen,'http')}" th:alt="${producto.nombre}" th:src="${producto.imagen}" />
            <img class="card-img-top" th:if="${producto.imagen != null and not #strings.startsWith(producto.imagen,'http')}" th:alt="${producto.nombre}" th:src="@{/imagenes/{img}(img=${producto.imagen})}" />
            <img class="card-img-top" th:if="${producto.imagen == null or producto.imagen == ''}" th:alt="${producto.nombre}" th:src="@{'https://via.placeholder.com/300x200?text=Sin+imagen'}" />
            
            <h5 class="card-title mt-3" th:text="${producto.nombre}">Nombre del Producto</h5>
            <p class="card-text text-muted" th:text="${producto.marca} + ' - ' + ${producto.modelo}">Marca - Modelo</p>
            <p class="card-text text-success fw-bold" th:text="${producto.precioStr}">S/ 0.00</p>
            <a th:href="@{/producto/{id}(id=${producto.id})}" class="btn btn-primary">Comprar</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
