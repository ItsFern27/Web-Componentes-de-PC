<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="${producto.nombre} + ' - PCCore'">Producto</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/styles/styles.css}" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<main class="container mt-5">
		<div class="row">
			<div class="col-md-6">
				<div class="card border-0 shadow-sm">
					<div class="card-body text-center">
						<img th:if="${producto.imagen != null and #strings.startsWith(producto.imagen,'http')}" th:src="${producto.imagen}" th:alt="${producto.nombre}" class="img-fluid" />
						<img th:if="${producto.imagen != null and producto.imagen != '' and not #strings.startsWith(producto.imagen,'http')}" th:src="@{/imagenes/{img}(img=${producto.imagen})}" th:alt="${producto.nombre}" class="img-fluid" />
						<img th:if="${producto.imagen == null or producto.imagen == ''}" th:src="@{'https://via.placeholder.com/600x400?text=Sin+imagen'}" th:alt="${producto.nombre}" class="img-fluid" />
					</div>
				</div>
			</div>

			<div class="col-md-6">
				<h2 th:text="${producto.nombre}">Nombre del producto</h2>
				<p class="text-muted" th:text="${producto.marca} + ' - ' + ${producto.modelo}">Marca - Modelo</p>
				<h3 class="text-success" th:text="${producto.precioStr}">S/ 0.00</h3>
				<p th:text="${producto.descripcion}">Descripción del producto</p>

				<!-- Categorías -->
				<div class="mb-3">
					<span class="fw-bold">Categorías:</span>
					<span th:if="${producto.categorias == null or #lists.isEmpty(producto.categorias)}" class="text-muted"> Sin categorías asignadas</span>
					<span th:each="pc : ${producto.categorias}" class="badge bg-secondary ms-1" th:text="${pc.categoria.nombre}"></span>
				</div>

				<!-- Lista de items disponibles -->
				<div class="mt-4">
					<h5>Disponibilidad</h5>
					<div th:if="${producto.item == null or #lists.isEmpty(producto.item)}" class="alert alert-info">No hay unidades disponibles por el momento.</div>
					<div th:if="${not #lists.isEmpty(producto.item)}">
						<table class="table table-sm table-hover">
							<thead>
								<tr>
									<th>Precio</th>
									<th>Estado</th>
									<th>Proveedor</th>
									<th>Nº Serie</th>
									<th>Descuento</th>
									<th>Ingreso</th>
									<th></th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="it : ${producto.item}">
									<td th:text="${#numbers.formatDecimal(it.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
									<td th:text="${it.estado}">Nuevo</td>
									<td th:text="${it.proveedor != null ? it.proveedor.nombre : 'N/A'}">Proveedor</td>
									<td th:text="${it.numero_de_serie != null ? it.numero_de_serie : '-'}">-</td>
									<td th:text="${it.porcentaje_descuento != 0 ? it.porcentaje_descuento + '%':'-'}">-</td>
									<td th:text="${it.fecha_ingreso != null ? it.fecha_ingreso.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : '-'}">-</td>
									<td>
										<!-- Placeholder: implementar endpoint de compra -->
										<button type="button" class="btn btn-sm btn-success btn-comprar" th:attr="data-item-id=${it.id}">Comprar</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
        
			</div>
		</div>
	</main>

	<div th:replace="~{fragments/footer :: footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		// Handler simple para botones de compra (placeholder)
		document.addEventListener('click', function(e){
			const btn = e.target.closest && e.target.closest('.btn-comprar');
			if(!btn) return;
			const itemId = btn.getAttribute('data-item-id');

			fetch(`/api/purchase/${itemId}`, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				}
			})
			.then(response => {
				if (response.ok) {
					return response.text(); // O response.json() si el backend devuelve JSON
				} else if (response.status === 401) {
					window.location.href = '/login'; // Redirigir al login si no está autenticado
					return Promise.reject('No autenticado');
				} else {
					return response.text().then(text => Promise.reject(text));
				}
			})
			.then(message => {
				alert('¡Compra exitosa! ' + message);
				// Opcional: Recargar la página o actualizar el estado del ítem en la UI
				window.location.reload();
			})
			.catch(error => {
				console.error('Error en la compra:', error);
				alert('Error al procesar la compra: ' + error);
			});
		});
	</script>
</body>
</html>
