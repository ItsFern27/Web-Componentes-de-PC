<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin_menu :: admin_menu}"></div>
            </div>
            <div class="col-md-9">
                <h1>Gestionar Proveedores</h1>
                <div class="col-md-9">
                    <!-- Mensajes -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Título + Crear -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1>Gestionar Proveedores</h1>

                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createProveedorModal">
                            Crear Nuevo Proveedor
                        </button>
                    </div>

                    <!-- TABLA DE PROVEEDORES -->
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="prov : ${proveedores}">
                                <td th:text="${prov.id}"></td>
                                <td th:text="${prov.nombre}"></td>
                                <td th:text="${prov.telefono}"></td>
                                <td th:text="${prov.email}"></td>

                                <td>
                                    <!-- Botón editar -->
                                    <button 
                                        type="button" 
                                        class="btn btn-sm btn-warning"
                                        data-bs-toggle="modal"
                                        th:attr="data-bs-target='#editProveedorModal-' + ${prov.id}">
                                        Editar
                                    </button>

                                    <!-- Botón eliminar -->
                                    <form 
                                        th:action="@{/admin/proveedores/eliminar/{id}(id=${prov.id})}" 
                                        method="post" 
                                        class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>

                <!-- MODAL: CREAR PROVEEDOR -->
                <div class="modal fade" id="createProveedorModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">

                            <form th:action="@{/admin/proveedores/crear}" th:object="${proveedorNuevo}" method="post">

                                <div class="modal-header">
                                    <h5 class="modal-title">Crear Nuevo Proveedor</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>

                                <div class="modal-body">

                                    <div class="mb-3">
                                        <label class="form-label">Nombre</label>
                                        <input type="text" class="form-control" th:field="*{nombre}" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Teléfono</label>
                                        <input type="text" class="form-control" th:field="*{telefono}">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" th:field="*{email}">
                                    </div>

                                </div>

                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                    <button type="submit" class="btn btn-primary">Guardar Proveedor</button>
                                </div>

                            </form>

                        </div>
                    </div>
                </div>

                <!-- MODALES: EDITAR PROVEEDOR -->
                <div th:each="prov : ${proveedores}">
                    <div class="modal fade" th:id="'editProveedorModal-' + ${prov.id}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">

                                <form th:action="@{/admin/proveedores/editar/{id}(id=${prov.id})}" method="post">

                                    <div class="modal-header">
                                        <h5 class="modal-title">Editar Proveedor</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>

                                    <div class="modal-body">

                                        <div class="mb-3">
                                            <label class="form-label">Nombre</label>
                                            <input type="text" class="form-control" name="nombre" th:value="${prov.nombre}" required>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Teléfono</label>
                                            <input type="text" class="form-control" name="telefono" th:value="${prov.telefono}">
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Email</label>
                                            <input type="email" class="form-control" name="email" th:value="${prov.email}">
                                        </div>

                                    </div>

                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>
                </div>

        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
