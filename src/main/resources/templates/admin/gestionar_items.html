<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin_menu :: admin_menu}"></div>
            </div>
            <div style="margin-bottom: 22vh;" class="col-md-9">
                <h2>Crear Nuevo Item</h2>

                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

                <form th:action="@{/admin/items/crear}" th:object="${itemNuevo}" method="post" class="card p-4">
                    <div class="row">
                        <!-- Columna 1 -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="producto" class="form-label">Producto:</label>
                                <select id="producto" th:field="*{producto}" class="form-select" required>
                                    <option value="">-- Seleccione un Producto --</option>
                                    <option th:each="prod : ${productos}" th:value="${prod.id}" th:text="${prod.marca + ' ' + prod.modelo}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="proveedor" class="form-label">Proveedor:</label>
                                <select id="proveedor" th:field="*{proveedor}" class="form-select" required>
                                    <option value="">-- Seleccione un Proveedor --</option>
                                    <option th:each="prov : ${proveedores}" th:value="${prov.id}" th:text="${prov.nombre}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio:</label>
                                <input type="number" id="precio" th:field="*{precio}" class="form-control" step="0.01" required />
                            </div>
                        </div>
                        <!-- Columna 2 -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="numero_de_serie" class="form-label">Número de Serie:</label>
                                <input type="text" id="numero_de_serie" th:field="*{numero_de_serie}" class="form-control" />
                            </div>
                            <!-- <div class="mb-3">
                                <label for="estado" class="form-label">Estado:</label>
                                <input type="text" id="estado" th:field="*{estado}" class="form-control" required />
                            </div> -->
                            <div class="mb-3">
                                <label for="porcentaje_descuento" class="form-label">Porcentaje Descuento:</label>
                                <input type="number" id="porcentaje_descuento" th:field="*{porcentaje_descuento}" class="form-control" />
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Crear Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>
</html>
