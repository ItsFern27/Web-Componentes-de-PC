<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Gestionar Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>

<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin_menu :: admin_menu}"></div>
            </div>
            <div class="col-md-9">
                <!-- Success and Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1>Gestionar Productos</h1>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createProductModal">
                        Crear Nuevo Producto
                    </button>
                </div>

                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Product data will be populated here by Thymeleaf -->
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.id}"></td>
                            <td th:text="${producto.nombre}"></td>
                            <td th:text="${producto.marca}"></td>
                            <td th:text="${producto.modelo}"></td>
                            <td th:text="${producto.descripcion}"></td>
                            <td>
                                <button type="button" class="btn btn-sm btn-warning" data-bs-toggle="modal" 
                                        th:attr="data-bs-target='#editProductModal-' + ${producto.id}">
                                    Editar
                                </button>
                                <form th:action="@{/admin/productos/eliminar/{id}(id=${producto.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Product Modal -->
    <div class="modal fade" id="createProductModal" tabindex="-1" aria-labelledby="createProductModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/productos/crear}" th:object="${productoNuevo}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createProductModalLabel">Crear Nuevo Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label for="marca" class="form-label">Marca</label>
                            <input type="text" class="form-control" id="marca" th:field="*{marca}" required>
                        </div>
                        <div class="mb-3">
                            <label for="modelo" class="form-label">Modelo</label>
                            <input type="text" class="form-control" id="modelo" th:field="*{modelo}" required>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                        </div>
                         <div class="mb-3">
                            <label for="imagen" class="form-label">URL de la Imagen</label>
                            <input type="text" class="form-control" id="imagen" th:field="*{imagen}">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-primary">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Product Modals -->
    <div th:each="producto : ${productos}">
        <div class="modal fade" th:id="'editProductModal-' + ${producto.id}" tabindex="-1" th:aria-labelledby="'editProductModalLabel-' + ${producto.id}" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/admin/productos/editar/{id}(id=${producto.id})}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title" th:id="'editProductModalLabel-' + ${producto.id}">Editar Producto</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <!-- The id is part of the action URL, no hidden input needed if not used by @ModelAttribute -->
                            <div class="mb-3">
                                <label th:for="'nombre-' + ${producto.id}" class="form-label">Nombre</label>
                                <input type="text" class="form-control" th:id="'nombre-' + ${producto.id}" name="nombre" th:value="${producto.nombre}" required>
                            </div>
                            <div class="mb-3">
                                <label th:for="'marca-' + ${producto.id}" class="form-label">Marca</label>
                                <input type="text" class="form-control" th:id="'marca-' + ${producto.id}" name="marca" th:value="${producto.marca}" required>
                            </div>
                            <div class="mb-3">
                                <label th:for="'modelo-' + ${producto.id}" class="form-label">Modelo</label>
                                <input type="text" class="form-control" th:id="'modelo-' + ${producto.id}" name="modelo" th:value="${producto.modelo}" required>
                            </div>
                            <div class="mb-3">
                                <label th:for="'descripcion-' + ${producto.id}" class="form-label">Descripción</label>
                                <textarea class="form-control" th:id="'descripcion-' + ${producto.id}" name="descripcion" th:text="${producto.descripcion}" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label th:for="'imagen-' + ${producto.id}" class="form-label">URL de la Imagen</label>
                                <input type="text" class="form-control" th:id="'imagen-' + ${producto.id}" name="imagen" th:value="${producto.imagen}">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
