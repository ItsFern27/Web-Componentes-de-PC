<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>
<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin_menu :: admin_menu}"></div>
            </div>
            <div class="col-md-9">
                <h2>Editar Item de Producto</h2>

                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/admin/items/editar/{id}(id=${item.id})}" th:object="${item}" method="post">
                            <div class="mb-3">
                                <label for="producto" class="form-label">Producto</label>
                                <select th:field="*{producto}" class="form-select">
                                    <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="proveedor" class="form-label">Proveedor</label>
                                <select th:field="*{proveedor}" class="form-select">
                                    <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.nombre}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio</label>
                                <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}">
                            </div>
                            <div class="mb-3">
                                <label for="numero_de_serie" class="form-label">Número de Serie</label>
                                <input type="text" class="form-control" id="numero_de_serie" th:field="*{numero_de_serie}">
                            </div>
                            <div class="mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <input type="text" class="form-control" id="estado" th:field="*{estado}">
                            </div>
                             <div class="mb-3">
                                <label for="porcentaje_descuento" class="form-label">Descuento (%)</label>
                                <input type="number" class="form-control" id="porcentaje_descuento" th:field="*{porcentaje_descuento}">
                            </div>
                            <div class="mb-3">
                                <label for="fecha_ingreso" class="form-label">Fecha de Ingreso</label>
                                <input type="date" class="form-control" id="fecha_ingreso" th:field="*{fecha_ingreso}">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            <a th:href="@{/admin/busqueda_avanzada}" class="btn btn-secondary">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
