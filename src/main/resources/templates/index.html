<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <link rel="stylesheet"  />
</head>

<body>
    <h1>Usuarios</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Creado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario['id']}"></td>
                <td th:text="${usuario['nombre'] ?: 'No encontrado'}"></td>
                <td th:text="${usuario['email'] ?: 'No encontrado'}"></td>
                <td th:text="${usuario['created_at']}"></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
