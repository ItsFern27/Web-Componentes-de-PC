<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCCore</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tus estilos (servidos desde /static) -->
  <link th:href="@{/styles/styles.css}" rel="stylesheet" />

  <!-- Bootstrap Icons (ya los usas) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>

<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <section>
    <div class="banner">
      <div class="banner-content">
        <h1><b>COMPONENTES DE PC</b></h1><br>
        <p>Todo lo que necesitas para armar tu PC ideal</p>
      </div>
    </div>       
  </section>

  <main>

    <div class="container mt-4">
      
      <div class="text-center mb-4">
        <hr>
        <p><b>-NOVEDADES-</b></p>
        <hr>
      </div>

      <div id="carouselInicio" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner" th:if="${novedades != null and not #lists.isEmpty(novedades)}">
          <div th:each="novedad, iterStat : ${novedades}" 
               th:classappend="${iterStat.index == 0} ? 'active'" 
               class="carousel-item">
            
            <!-- Usar la misma lógica de imagen que en la lista de productos -->
            <img th:if="${novedad.imagen != null and #strings.startsWith(novedad.imagen,'http')}" th:src="${novedad.imagen}" class="d-block w-100" th:alt="${novedad.nombre}">
            <img th:if="${novedad.imagen != null and not #strings.startsWith(novedad.imagen,'http')}" th:src="@{/imagenes/{img}(img=${novedad.imagen})}" class="d-block w-100" th:alt="${novedad.nombre}">
            <img th:if="${novedad.imagen == null or novedad.imagen == ''}" th:src="@{'https://via.placeholder.com/800x400?text=Sin+imagen'}" class="d-block w-100" th:alt="${novedad.nombre}">

            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
              <h5 th:text="${novedad.nombre}"></h5>
              <p th:text="${novedad.descripcion}"></p>
            </div>
          </div>
        </div>

        <!-- Mensaje si no hay novedades -->
        <div th:if="${novedades == null or #lists.isEmpty(novedades)}" class="alert alert-info">
          No hay novedades para mostrar.
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselInicio" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        
        <button class="carousel-control-next" type="button" data-bs-target="#carouselInicio" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <div class="text-center mb-4">
        <hr>
        <p><b>-DESTACADOS-</b></p>
        <hr>
      </div>

      <!-- Lista de productos -->
      <div class="row g-4">
        <div class="col-12">
          <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info">No hay productos para mostrar.</div>
        </div>

        <div class="col-md-3 col-sm-6" th:each="producto : ${productos}">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body text-center">
                  <!-- Si imagen es una URL completa -->
                  <img class="card-img-top product-card-image" th:if="${producto.imagen != null and #strings.startsWith(producto.imagen,'http')}" th:alt="${producto.nombre}" th:src="${producto.imagen}" />
                  <!-- Si imagen es un nombre de archivo relativo dentro de /imagenes -->
                  <img class="card-img-top product-card-image" th:if="${producto.imagen != null and producto.imagen != '' and !#strings.startsWith(producto.imagen,'http')}" th:alt="${producto.nombre}" th:src="@{/imagenes/{img}(img=${producto.imagen})}" />
                  <!-- Si no hay imagen, usar placeholder -->
                  <img class="card-img-top product-card-image" th:if="${producto.imagen == null or producto.imagen == ''}" th:alt="${producto.nombre}" th:src="@{'https://via.placeholder.com/300x200?text=Sin+imagen'}" />
              <h5 class="card-title mt-3" th:text="${producto.nombre}">Nombre</h5>
              <p class="card-text text-muted" th:text="${producto.marca} + ' - ' + ${producto.modelo}">Marca - Modelo</p>
              <p class="card-text text-success fw-bold" th:text="${producto.precioStr}">S/ 0.00</p>
              <p class="card-text text-muted" th:text="${producto.descripcion}">Descripción</p>
              <a th:href="@{/producto/{id}(id=${producto.id})}" class="btn btn-primary">Comprar</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  
  <div th:replace="~{fragments/footer :: footer}"></div>
    
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Easter egg para los verdaderos OldSkulls
    const logoText = document.querySelector('.logo-text');
    let clickCount = 0;
    logoText.addEventListener('click', function() {
      clickCount++;
      if (clickCount === 10) {
        logoText.textContent = 'FernanxDalas';
      }
    });
  </script>
</body>
</html>
